# HOU-168: the offline secret scan `pnpm check` runs (scripts/secrets.ts) over every file git tracks or
# would track. No network and no API key. A finding prints the file and line, never the value.
# Test credentials are made at runtime (randomBytes); the practice household's public values live in
# contracts/src/practice.ts and are built from its name. So nothing here is allowlisted by value.
rules:
  # secretlint's recommended rules: real provider formats (AWS, GCP, GitHub, Slack, npm, OpenAI,
  # Anthropic, private keys, http basic auth ...).
  - id: "@secretlint/secretlint-rule-preset-recommend"
  # The generic shapes GitGuardian flags in this repo, which the preset does not look for.
  - id: "@secretlint/secretlint-rule-pattern"
    options:
      patterns:
        - name: a literal assigned to a password, secret, token or API key
          # `password: "x"`, `const SECRET = "x"`, `"X-Webhook-Secret": "x"`, `token = "x"` (default
          # parameters). One narrow exception: Google's nextSyncToken and nextPageToken are paging
          # cursors, not credentials. A value with `$`, `{` or `}` is an interpolation, not a literal.
          patterns:
            - '/(?:passw(?:or)?d|secret|(?<!sync|page)token|api_?key)s?["'']?\s*[:=]\s*["''`](?<value>[^"''`\s${}]{2,})["''`]/gi'
        - name: a literal in a NAME=value setting for a password, secret, token or API key
          # .env lines, shell and compose. The value must start with a letter or digit, so a regex
          # like `^MCP_TOKEN=.*$` or an empty `ANTHROPIC_API_KEY=` is not a setting.
          patterns:
            - '/[A-Z0-9_]*(?:PASSWORD|SECRET|TOKEN|API_KEY)=(?<value>[A-Za-z0-9][^\s"''`${}<]+)/g'
        - name: a password inside a URL
          # Any scheme (postgres:// included, which the preset skips). Passwords go in PGPASSWORD.
          patterns:
            - '/[a-z][a-z0-9+.-]*:\/\/[^\s:@\/"''`]+:(?<value>[^\s@\/"''`${}]+)@/gi'
